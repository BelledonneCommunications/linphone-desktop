win64-ninja-vs2022-package-windows:
  variables:
    CMAKE_GENERATOR: "Ninja"
    CMAKE_ARCHITECTURE: ""
    PARALLEL_OPTIONS: ""
    WINDOWS_PACKAGE_CMAKE_OPTIONS: -DENABLE_WINDOWS_MSI=OFF
  extends:
    - .windows-vs2022
    - .windows-ninja-variables
    - .vs-win64-package
  rules:
    - if: $SKIP_WINDOWS_NSIS
      when: never
    - !reference [.vs-win64-package, rules]
  before_script:
    - 'if ($env:WINDOWS_UPDATE_PACKAGE -eq "msi" -and -not $env:SKIP_WINDOWS_MSI) { $RELEASE_FILE = "" }'

win64-ninja-vs2022-package-msi-windows:
  variables:
    CMAKE_GENERATOR: "Ninja"
    CMAKE_ARCHITECTURE: ""
    PARALLEL_OPTIONS: ""
    WIX_VERSION: "5.0.2"
    MSI_CMAKE_VERSION: "3.31.6"
    WINDOWS_PACKAGE_CMAKE_OPTIONS: -DENABLE_WINDOWS_MSI=ON -DLINPHONE_WIX_VERSION=$WIX_VERSION
  extends:
    - .windows-vs2022
    - .windows-ninja-variables
    - .vs-win64-package
  rules:
    - if: $SKIP_WINDOWS_MSI
      when: never
    - !reference [.vs-win64-package, rules]
  before_script:
    - 'if ($env:WINDOWS_UPDATE_PACKAGE -ne "msi" -and -not $env:SKIP_WINDOWS_NSIS) { $RELEASE_FILE = "" }'
    - $ProgressPreference = "SilentlyContinue"
    - '[Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12'
    - $cmakeName = "cmake-$env:MSI_CMAKE_VERSION-windows-x86_64"
    - $cmakeDir = Join-Path $env:USERPROFILE ".linphone-ci\$cmakeName"
    - $cmakeTemp = Join-Path $env:TEMP "linphone-$cmakeName"
    - $needCMake = -not (Test-Path (Join-Path $cmakeDir "bin\cmake.exe"))
    - 'if ($needCMake) { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $cmakeTemp, $cmakeDir; New-Item -ItemType Directory -Force -Path $cmakeTemp | Out-Null }'
    - 'if ($needCMake) { $cmakeUrl = "https://github.com/Kitware/CMake/releases/download/v$env:MSI_CMAKE_VERSION"; Invoke-WebRequest -UseBasicParsing -Uri "$cmakeUrl/$cmakeName.zip" -OutFile "$cmakeTemp\$cmakeName.zip"; Invoke-WebRequest -UseBasicParsing -Uri "$cmakeUrl/cmake-$env:MSI_CMAKE_VERSION-SHA-256.txt" -OutFile "$cmakeTemp\SHA-256.txt" }'
    - 'if ($needCMake) { $expectedHash = Get-Content "$cmakeTemp\SHA-256.txt" | ForEach-Object { if ($_ -match "^([0-9a-fA-F]{64})\s+(\S+)$" -and $Matches[2] -eq "$cmakeName.zip") { $Matches[1] } } | Select-Object -First 1; $actualHash = (Get-FileHash -Algorithm SHA256 "$cmakeTemp\$cmakeName.zip").Hash; if (-not $expectedHash -or $actualHash -ne $expectedHash) { throw "Error: CMake $env:MSI_CMAKE_VERSION archive checksum mismatch" } }'
    - 'if ($needCMake) { Expand-Archive -Path "$cmakeTemp\$cmakeName.zip" -DestinationPath "$cmakeTemp\extract" -Force; New-Item -ItemType Directory -Force -Path (Split-Path $cmakeDir) | Out-Null; Move-Item "$cmakeTemp\extract\$cmakeName" $cmakeDir; Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $cmakeTemp }'
    - $env:Path = "$cmakeDir\bin;$env:USERPROFILE\.dotnet\tools;$env:Path"
    - cmake --version
    - 'if (-not ($LastExitCode -eq 0)) { throw "Error: CMake $env:MSI_CMAKE_VERSION is not usable" }'
    - $nugetDir = Join-Path $env:TEMP "linphone-wix-nuget"
    - New-Item -ItemType Directory -Force -Path $nugetDir | Out-Null
    - $nugetConfig = Join-Path $nugetDir "NuGet.Config"
    - 'Set-Content -Encoding UTF8 -Path $nugetConfig -Value ''<?xml version="1.0" encoding="utf-8"?><configuration><packageSources><add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" /></packageSources></configuration>'''
    - Push-Location $nugetDir
    - $installedWix = if (Get-Command wix -ErrorAction SilentlyContinue) { "$(wix --version)" } else { "" }
    - 'if (-not $installedWix.StartsWith($WIX_VERSION)) { if ($installedWix) { dotnet tool uninstall --global wix }; dotnet tool install --global wix --version $WIX_VERSION --configfile $nugetConfig; if (-not ($LastExitCode -eq 0)) { Pop-Location; throw "Error: WiX installation failed" } }'
    - wix extension add --global "WixToolset.UI.wixext/$WIX_VERSION"
    - 'if (-not ($LastExitCode -eq 0)) { Pop-Location; throw "Error: WiX UI extension installation failed" }'
    - Pop-Location
    - wix --version

