.win64-msi-tests:
  stage: test
  needs:
    - win64-ninja-vs2022-package-msi-windows
  rules:
    - if: $SKIP_WINDOWS_MSI
      when: never
    - if: $ENABLE_WINDOWS_MSI_TESTS && $NIGHTLY_MASTER
    - if: $ENABLE_WINDOWS_MSI_TESTS && $PACKAGE_WINDOWS
    - if: $ENABLE_WINDOWS_MSI_TESTS && $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  script:
    - $msi = Get-ChildItem build-desktop\OUTPUT\Packages\*.msi | Select-Object -First 1
    - 'if (-not $msi) { throw "Error: no MSI package in build-desktop\OUTPUT\Packages" }'
    - $workDir = Join-Path $env:CI_PROJECT_DIR "msi-tests"
    - $testArguments = @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "cmake\install\windows\msi\tests\Test-MsiInstaller.ps1", "-Msi", $msi.FullName, "-Suite", $env:MSI_TESTS_SUITE, "-WorkDir", $workDir, "-JUnit", (Join-Path $workDir "report.xml"), "-UninstallExisting")
    - 'if ($env:NSIS_REFERENCE_INSTALLER_URL) { $nsis = Join-Path $env:CI_PROJECT_DIR "nsis-reference.exe"; Invoke-WebRequest -UseBasicParsing -Uri $env:NSIS_REFERENCE_INSTALLER_URL -OutFile $nsis; $testArguments += @("-NsisInstaller", $nsis) }'
    - powershell @testArguments
    - 'if (-not ($LastExitCode -eq 0)) { throw "Error: MSI installer tests failed" }'
  artifacts:
    when: always
    paths:
      - msi-tests\logs\*
      - msi-tests\report.xml
    reports:
      junit: msi-tests/report.xml
    expire_in: 3 days

win64-msi-tests:
  extends: .win64-msi-tests
  tags: [ "windows-powershell-msi-tests-interactive" ]
  variables:
    MSI_TESTS_SUITE: Full

#################################################
#               SIGNING
#################################################

win64-codesigning:
  stage: signing
  allow_failure: true
  extends:
    - .windows-codesigning
  needs:
    - job: win64-ninja-vs2022-package-windows
      optional: true
    - job: win64-ninja-vs2022-package-msi-windows
      optional: true
  variables:
    MINGW_TYPE: mingw64
  rules:
    - if: $SKIP_WINDOWS_NSIS && $SKIP_WINDOWS_MSI
      when: never
    - !reference [.rules-merge-request-manual, rules]
    - if: $PACKAGE_WINDOWS
    - if: $NIGHTLY_MASTER
  script:
    - cd build-desktop/OUTPUT/Packages/
    - $packages = @("*.exe", "*.msi") | Where-Object { Test-Path $_ }
    - 'if (-not $packages) { throw "Error: no package to sign in build-desktop\OUTPUT\Packages" }'
    - $signDescription = $(if ($env:APPLICATION_NAME) { $env:APPLICATION_NAME } else { "Linphone" }) -replace "'", "''"
    - Invoke-Expression "& ${WINDOWS_SIGN_TOOL} sign /fd SHA256 /d '$signDescription' /t ${WINDOWS_SIGN_TIMESTAMP_URL} /sha1 ${WINDOWS_SIGN_HASH} $($packages -join ' ')"
    - 'if (-not ($LastExitCode -eq 0)) {throw "Error: Signature failed"}'
  artifacts:
    paths:
      - build-desktop\OUTPUT\Packages\*
    when: always
    expire_in: 3 days

#################################################
#               DEPLOY
#################################################

.win64-upload:
  stage: deploy
  tags: [ "windows-powershell-flat" ]
  rules:
    - if: $NIGHTLY_MASTER
    - if: $DEPLOY_WINDOWS

  script:
    - $packages = @("build-desktop/OUTPUT/Packages/*.exe", "build-desktop/OUTPUT/Packages/*.msi") | Where-Object { Test-Path $_ }
    - 'if (-not $packages) { throw "Error: no package to upload in build-desktop/OUTPUT/Packages" }'
    - rsync --perms --chmod=Fu=rw,Fg=r,Fo=r @packages ${DEPLOY_SERVER}:${UPLOAD_ROOT_PATH}/${WINDOWS_PLATFORM}/${APP_FOLDER}
    - if ($MAKE_RELEASE_FILE_URL) { rsync --perms --chmod=Fu=rw,Fg=r,Fo=r build-desktop/OUTPUT/Packages/RELEASE ${DEPLOY_SERVER}:${UPLOAD_ROOT_PATH}/${WINDOWS_PLATFORM}/ }

win64-ninja-vs2022-upload:
  extends:
    - .win64-upload
  needs:
    - win64-codesigning

.win64-plugins-upload:
  stage: deploy
  tags: [ "windows-flat" ]
  rules:
    - if: $DEPLOY_PLUGINS
  script:
    - scp "build-desktop/OUTPUT/plugins/app/*.dll" "%DEPLOY_SERVER%:%WINDOWS_UPLOAD_DIRECTORY%/plugins"

win64-ninja-vs2022-plugins-upload:
  extends: .win64-plugins-upload
  needs:
    - win64-ninja-vs2022-scheduled-windows
